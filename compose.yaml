services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - pipelens-data:/data
    environment:
      PIPELENS_DATABASE_PATH: /data/pipelens.db
      PIPELENS_QUEUE_BACKEND: redis
      PIPELENS_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "pipelens.worker"]
    env_file:
      - path: .env
        required: false
    ports:
      - "8001:8001"
    volumes:
      - pipelens-data:/data
    environment:
      PIPELENS_DATABASE_PATH: /data/pipelens.db
      PIPELENS_QUEUE_BACKEND: redis
      PIPELENS_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pipelens-data:
