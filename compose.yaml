services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PIPELENS_DATABASE_URL: postgresql+psycopg://pipelens:pipelens@postgres:5432/pipelens
      PIPELENS_QUEUE_BACKEND: redis
      PIPELENS_REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "pipelens.worker"]
    env_file:
      - path: .env
        required: false
    ports:
      - "8001:8001"
    environment:
      PIPELENS_DATABASE_URL: postgresql+psycopg://pipelens:pipelens@postgres:5432/pipelens
      PIPELENS_QUEUE_BACKEND: redis
      PIPELENS_REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      PIPELENS_DATABASE_URL: postgresql+psycopg://pipelens:pipelens@postgres:5432/pipelens
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pipelens
      POSTGRES_USER: pipelens
      POSTGRES_PASSWORD: pipelens
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelens -d pipelens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
