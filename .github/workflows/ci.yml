name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pipelens_test
          POSTGRES_USER: pipelens
          POSTGRES_PASSWORD: pipelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipelens -d pipelens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/ops/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml
      - name: Validate observability stack
        run: |
          docker compose config --quiet
          python -m json.tool ops/grafana/dashboards/pipelens-overview.json >/dev/null
      - name: Test PostgreSQL and Redis integration
        run: pytest -q tests/integration
        env:
          PIPELENS_TEST_DATABASE_URL: postgresql+psycopg://pipelens:pipelens@localhost:5432/pipelens_test
          PIPELENS_TEST_REDIS_URL: redis://localhost:6379/0
      - run: pipelens-evaluate --minimum-accuracy 0.8

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  containers:
    name: Build container (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: dashboard
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "pipelens-${{ matrix.name }}:ci"
          "${{ matrix.context }}"
