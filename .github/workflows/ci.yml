name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the repository for exposed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          timeout: 10m

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify GitHub Action pinning
        run: python ops/ci/verify_action_pinning.py
      - name: Verify Dockerfile base image pinning
        run: python ops/ci/verify_dockerfile_pinning.py
      - name: Verify Markdown documentation integrity
        run: python ops/ci/verify_markdown_links.py
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - name: Check Python types
        run: mypy
      - name: Verify OpenAPI contract
        run: python ops/ci/export_openapi.py --check
      - name: Run tests with Python coverage
        run: >-
          pytest -q
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json
      - name: Upload Python coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate Prometheus configuration
        run: |
          prometheus_image="$(docker compose config --format json | python -c '
          import json
          import sys

          print(json.load(sys.stdin)["services"]["prometheus"]["image"])
          ')"
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            "$prometheus_image" check config /etc/prometheus/prometheus.yml

          prometheus_container="pipelens-prometheus-smoke"
          docker run --detach --rm --name "$prometheus_container" \
            --network none \
            -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            "$prometheus_image" \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/tmp/prometheus \
            --storage.tsdb.retention.time=1h
          trap 'docker stop "$prometheus_container"' EXIT
          for attempt in {1..10}; do
            if docker exec "$prometheus_container" \
              promtool check ready --url=http://localhost:9090; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$prometheus_container"
          exit 1
      - name: Validate observability stack
        run: |
          docker compose config --quiet
          docker compose config --format json | python -c '
          import json
          import re
          import sys

          config = json.load(sys.stdin)
          images = {
              name: service["image"]
              for name, service in config["services"].items()
              if service.get("image")
          }
          digest_reference = re.compile(r"^.+@sha256:[0-9a-f]{64}$")
          unpinned = {
              name: image
              for name, image in images.items()
              if not digest_reference.fullmatch(image)
          }
          assert images, "Compose configuration contains no external images"
          assert not unpinned, f"Compose images must be pinned by digest: {unpinned}"
          '
          python -m json.tool ops/grafana/dashboards/pipelens-overview.json >/dev/null
      - name: Verify Prometheus to Alertmanager webhook routing
        run: |
          ALERTMANAGER_IMAGE="$(docker compose config --format json | python -c '
          import json
          import sys

          print(json.load(sys.stdin)["services"]["alertmanager"]["image"])
          ')" \
          PROMETHEUS_IMAGE="$(docker compose config --format json | python -c '
          import json
          import sys

          print(json.load(sys.stdin)["services"]["prometheus"]["image"])
          ')" \
            ops/alertmanager/verify-routing.sh
      - name: Verify Grafana 12 to 13 upgrade
        env:
          GRAFANA_PREVIOUS_IMAGE: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
          GRAFANA_PREVIOUS_VERSION: 12.1.0
        run: |
          grafana_current_image="$(docker compose config --format json | python -c '
          import json
          import sys

          print(json.load(sys.stdin)["services"]["grafana"]["image"])
          ')"
          grafana_current_version="$(
            python -m ops.grafana.image_version "$grafana_current_image"
          )"
          GRAFANA_CURRENT_IMAGE="$grafana_current_image" \
          GRAFANA_CURRENT_VERSION="$grafana_current_version" \
            ops/grafana/verify-major-upgrade.sh
      - name: Verify PostgreSQL 17 to 18 upgrade
        env:
          POSTGRES_PREVIOUS_IMAGE: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        run: |
          POSTGRES_CURRENT_IMAGE="$(docker compose config --format json | python -c '
          import json
          import sys

          print(json.load(sys.stdin)["services"]["postgres"]["image"])
          ')" \
            ops/postgres/verify-major-upgrade.sh
      - name: Verify isolated PostgreSQL and Grafana recovery smoke
        run: |
          postgres_image="$(docker compose config --format json | python -c '
          import json
          import sys

          print(json.load(sys.stdin)["services"]["postgres"]["image"])
          ')"
          grafana_image="$(docker compose config --format json | python -c '
          import json
          import sys

          print(json.load(sys.stdin)["services"]["grafana"]["image"])
          ')"
          grafana_version="$(python -m ops.grafana.image_version "$grafana_image")"
          POSTGRES_IMAGE="$postgres_image" \
          GRAFANA_IMAGE="$grafana_image" \
          GRAFANA_VERSION="$grafana_version" \
            ops/recovery/verify-live-restore.sh
      - name: Start Compose PostgreSQL and Redis services
        run: ops/ci/integration-services.sh start
      - name: Test PostgreSQL and Redis integration
        run: pytest -q tests/integration
        env:
          PIPELENS_TEST_DATABASE_URL: postgresql+psycopg://pipelens:pipelens@localhost:5432/pipelens_test
          PIPELENS_TEST_REDIS_URL: redis://localhost:6379/0
      - name: Verify worker replica load, recovery, and SLO
        run: >-
          python -m ops.worker.verify_replica_recovery
          --redis-url redis://localhost:6379/0
          --jobs 200
          --replicas 4
      - name: Verify isolated worker containers and fault recovery
        timeout-minutes: 5
        run: >-
          python -m ops.worker.run_container_soak
          --profile smoke
          --run-id worker-soak-ci
          --output-dir /tmp/pipelens-worker-soak-ci
      - name: Stop Compose PostgreSQL and Redis services
        if: always()
        run: ops/ci/integration-services.sh stop
      - run: pipelens-evaluate --minimum-accuracy 0.8

  python-compatibility:
    name: Python 3.14 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q --ignore=tests/integration
      - run: pipelens-evaluate --minimum-accuracy 0.8
      - name: Verify hashed runtime lock is current
        run: |
          pip install pip-tools==7.6.2
          pip-compile --quiet --generate-hashes --strip-extras --output-file=requirements.txt requirements.in
          git diff --exit-code requirements.txt

  python-latest:
    name: Python 3.15 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - run: python -c 'import sys; assert sys.version_info[:2] == (3, 15) and sys.version_info.releaselevel == "final"'
      - run: pip install -e '.[dev]'
      - run: python -m pip check
      - name: Verify binary PostgreSQL driver
        run: python -c 'import psycopg.pq; assert psycopg.pq.__impl__ == "binary", psycopg.pq.__impl__'
      - run: pytest -q --ignore=tests/integration
      - name: Start Compose PostgreSQL and Redis services
        run: ops/ci/integration-services.sh start
      - name: Test PostgreSQL and Redis integration
        run: pytest -q tests/integration
        env:
          PIPELENS_TEST_DATABASE_URL: postgresql+psycopg://pipelens:pipelens@localhost:5432/pipelens_test
          PIPELENS_TEST_REDIS_URL: redis://localhost:6379/0
      - name: Verify worker replica load, recovery, and SLO
        run: >-
          python -m ops.worker.verify_replica_recovery
          --redis-url redis://localhost:6379/0
          --jobs 200
          --replicas 4
      - name: Stop Compose PostgreSQL and Redis services
        if: always()
        run: ops/ci/integration-services.sh stop
      - run: pipelens-evaluate --minimum-accuracy 0.8

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ..
      - run: npm ci
      - run: npm test
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Run browser OAuth and dashboard E2E
        run: npm run test:e2e
        env:
          PYTHON: python
      - run: npm run build

  containers:
    name: Build container (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
            expected_user: pipelens
          - name: dashboard
            context: frontend
            dockerfile: frontend/Dockerfile
            expected_user: nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "pipelens-${{ matrix.name }}:ci"
          "${{ matrix.context }}"
      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "pipelens-${{ matrix.name }}:ci"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          timeout: 10m
      - name: Prepare SBOM output directory
        run: mkdir -p sbom
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "pipelens-${{ matrix.name }}:ci"
          format: cyclonedx
          output: "sbom/pipelens-${{ matrix.name }}.cdx.json"
          exit-code: "0"
          list-all-pkgs: true
          scanners: vuln
          timeout: 10m
          skip-setup-trivy: true
      - name: Validate CycloneDX SBOM
        env:
          SBOM_PATH: "sbom/pipelens-${{ matrix.name }}.cdx.json"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sbom = json.loads(Path(os.environ["SBOM_PATH"]).read_text())
          assert sbom["bomFormat"] == "CycloneDX"
          assert sbom["specVersion"]
          assert sbom["serialNumber"]
          assert sbom.get("components"), "SBOM contains no components"
          PY
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "pipelens-${{ matrix.name }}-sbom"
          path: "sbom/pipelens-${{ matrix.name }}.cdx.json"
          if-no-files-found: error
          retention-days: 14
      - name: Verify runtime user
        if: matrix.expected_user != ''
        run: >-
          test
          "$(docker image inspect "pipelens-${{ matrix.name }}:ci" --format '{{.Config.User}}')"
          = "${{ matrix.expected_user }}"
      - name: Smoke test API container
        if: matrix.name == 'api'
        run: |
          api_container="pipelens-api-smoke"
          docker run --detach --rm --name "$api_container" "pipelens-${{ matrix.name }}:ci"
          trap 'docker stop "$api_container"' EXIT
          for attempt in {1..10}; do
            if docker exec "$api_container" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=1)" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$api_container"
          exit 1
      - name: Smoke test dashboard container
        if: matrix.name == 'dashboard'
        run: |
          dashboard_container="pipelens-dashboard-smoke"
          docker run --detach --rm --name "$dashboard_container" \
            --add-host api:127.0.0.1 "pipelens-${{ matrix.name }}:ci"
          trap 'docker stop "$dashboard_container"' EXIT
          for attempt in {1..10}; do
            if docker exec "$dashboard_container" \
              wget --quiet --output-document=/dev/null http://127.0.0.1:8080/; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$dashboard_container"
          exit 1
