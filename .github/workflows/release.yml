name: Release containers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag, version, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH without leading zeroes" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          backend = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          dashboard = json.loads(Path("frontend/package.json").read_text())["version"]
          dashboard_lock = json.loads(Path("frontend/package-lock.json").read_text())
          assert backend == expected, f"backend version {backend!r} != tag {expected!r}"
          assert dashboard == expected, f"dashboard version {dashboard!r} != tag {expected!r}"
          assert dashboard_lock["version"] == expected, "package-lock root version mismatch"
          assert dashboard_lock["packages"][""]["version"] == expected, (
              "package-lock workspace version mismatch"
          )
          PY

  publish:
    name: Publish container (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
            expected_user: pipelens
          - name: dashboard
            context: frontend
            dockerfile: frontend/Dockerfile
            expected_user: nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve image name
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pipelens-${{ matrix.name }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      - name: Build release image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "$IMAGE_NAME:$RELEASE_TAG"
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --label "org.opencontainers.image.version=${RELEASE_TAG#v}"
          --label "org.opencontainers.image.licenses=MIT"
          "${{ matrix.context }}"
      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "${{ steps.image.outputs.name }}:${{ github.ref_name }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          timeout: 10m
      - name: Prepare SBOM output directory
        run: mkdir -p sbom
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: "${{ steps.image.outputs.name }}:${{ github.ref_name }}"
          format: cyclonedx
          output: "sbom/pipelens-${{ matrix.name }}.cdx.json"
          exit-code: "0"
          list-all-pkgs: true
          scanners: vuln
          timeout: 10m
          skip-setup-trivy: true
      - name: Validate CycloneDX SBOM
        env:
          SBOM_PATH: "sbom/pipelens-${{ matrix.name }}.cdx.json"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sbom = json.loads(Path(os.environ["SBOM_PATH"]).read_text())
          assert sbom["bomFormat"] == "CycloneDX"
          assert sbom["specVersion"]
          assert sbom["serialNumber"]
          assert sbom.get("components"), "SBOM contains no components"
          PY
      - name: Verify runtime user
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
        run: >-
          test
          "$(docker image inspect "$IMAGE_REF" --format '{{.Config.User}}')"
          = "${{ matrix.expected_user }}"
      - name: Smoke test API container
        if: matrix.name == 'api'
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
        run: |
          api_container="pipelens-api-release-smoke"
          docker run --detach --rm --name "$api_container" "$IMAGE_REF"
          trap 'docker stop "$api_container"' EXIT
          for attempt in {1..10}; do
            if docker exec "$api_container" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=1)" \
              >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$api_container"
          exit 1
      - name: Smoke test dashboard container
        if: matrix.name == 'dashboard'
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
        run: |
          dashboard_container="pipelens-dashboard-release-smoke"
          docker run --detach --rm --name "$dashboard_container" \
            --add-host api:127.0.0.1 "$IMAGE_REF"
          trap 'docker stop "$dashboard_container"' EXIT
          for attempt in {1..10}; do
            if docker exec "$dashboard_container" \
              wget --quiet --output-document=/dev/null http://127.0.0.1:8080/; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$dashboard_container"
          exit 1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release image
        id: push
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE_NAME:$RELEASE_TAG"
          digest="$(docker image inspect "$IMAGE_NAME:$RELEASE_TAG" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve pushed image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: "sbom/pipelens-${{ matrix.name }}.cdx.json"
          push-to-registry: true
          create-storage-record: false
