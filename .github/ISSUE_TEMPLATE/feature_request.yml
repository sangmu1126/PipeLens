name: Feature request
description: Propose a scoped capability or quality improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or operational problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State observable behavior and measurable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and important tradeoffs.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and evidence
      description: Identify affected components, compatibility boundaries, and evidence that would prove completion.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I removed secrets, private logs, repository identifiers, and personal data.
          required: true
