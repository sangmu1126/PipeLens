global:
  resolve_timeout: 1m

route:
  receiver: ci-webhook
  group_by: [alertname, severity]
  group_wait: 1s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: ci-webhook
    webhook_configs:
      - url: http://host.docker.internal:18080/alerts
        send_resolved: true
        max_alerts: 10
        timeout: 5s
