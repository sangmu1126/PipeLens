[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipelens"
version = "0.1.0"
description = "Evidence-first diagnostics for failed GitHub Actions runs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.19.1,<2",
  "cryptography>=50.0.1,<51",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.15.0,<3",
  "prometheus-client>=0.26.0,<1",
  "PyJWT[crypto]>=2.13.0,<3",
  "redis>=5.2,<7",
  "SQLAlchemy>=2.0.52,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.16.4,<1",
]

[project.scripts]
pipelens-evaluate = "pipelens.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
